<link rel="stylesheet" href="{{ "vendor/katex/katex.min.css" | relURL }}">
<script defer src="{{ "vendor/katex/katex.min.js" | relURL }}"></script>
<script defer src="{{ "vendor/katex/contrib/auto-render.min.js" | relURL }}"></script>
<script>
    const ensureKatexAvailable = async () => {
        for (let attempt = 0; attempt < 50; attempt += 1) {
            if (typeof renderMathInElement === "function" && typeof katex === "object") {
                return true;
            }
            await new Promise(resolve => setTimeout(resolve, 50));
        }
        throw new Error("self-hosted KaTeX assets did not initialize");
    };
    const renderMath = () => {
        const elementsToRender = [".main-article", ".widget--toc"];
        const renderOptions = {
            delimiters: [
                { left: "$$", right: "$$", display: true },
                { left: "$", right: "$", display: false },
                { left: "\\(", right: "\\)", display: false },
                { left: "\\[", right: "\\]", display: true }
            ],
            ignoredClasses: ["gist"],
            throwOnError: false,
            strict: "ignore"
        };

        elementsToRender.forEach(selector => {
            const element = document.querySelector(selector);
            if (!element) {
                return;
            }

            if (typeof renderMathInElement === "function") {
                try {
                    renderMathInElement(element, renderOptions);
                } catch (error) {
                    console.warn("KaTeX auto-render failed:", error);
                }
            }

            if (typeof katex === "object") {
                element.querySelectorAll(".math.inline, .math.display").forEach(mathElement => {
                    const expression = mathElement.textContent?.trim();
                    if (!expression) {
                        return;
                    }

                    try {
                        katex.render(expression, mathElement, {
                            displayMode: mathElement.classList.contains("display"),
                            throwOnError: false,
                            strict: "ignore"
                        });
                    } catch (error) {
                        console.warn("KaTeX passthrough render failed:", error);
                    }
                });
            }
        });
    };

    const scheduleMathRender = () => {
        const run = () => {
            try {
                return ensureKatexAvailable().then(renderMath).catch(error => {
                    console.warn("KaTeX load failed:", error);
                });
            } catch (error) {
                console.warn("KaTeX load failed:", error);
            }
        };

        if (window.requestIdleCallback) {
            window.requestIdleCallback(run, { timeout: 2500 });
            return;
        }

        setTimeout(run, 1200);
    };

    window.addEventListener("load", function () {
        scheduleMathRender();
    });
</script>
